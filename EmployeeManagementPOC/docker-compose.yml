services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: employee-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ngPass!2026"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: employee-redis
    ports:
      - "6379:6379"

  app:
    build:
      context: ..
      dockerfile: EmployeeManagementPOC/Dockerfile
    container_name: employee-management
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EmployeeManagementPOC;User Id=sa;Password=Str0ngPass!2026;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      # Demo-only secret. Real deployments inject this from a secret store.
      Jwt__SigningKey: "docker-compose-demo-signing-key-change-me-0123456789"
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedDemoUsers: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
