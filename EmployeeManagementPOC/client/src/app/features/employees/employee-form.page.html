<div class="container py-4">
  <div class="page-breadcrumb">Management <span>/</span> Employees</div>
  <h1 class="page-title mb-4">{{ isEdit() ? 'Edit Employee' : 'Create Employee' }}</h1>

  <form class="card shadow-sm" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="card-body">
      @if (formError(); as message) {
        <div class="alert alert-danger" role="alert">{{ message }}</div>
      }

      <div class="row g-3">
        <div class="col-md-6">
          <label for="firstName" class="form-label">First name</label>
          <input id="firstName" class="form-control" formControlName="firstName" />
          <app-field-error [control]="form.controls.firstName" />
        </div>

        <div class="col-md-6">
          <label for="lastName" class="form-label">Last name</label>
          <input id="lastName" class="form-control" formControlName="lastName" />
          <app-field-error [control]="form.controls.lastName" />
        </div>

        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" formControlName="email" />
          <app-field-error [control]="form.controls.email" />
        </div>

        <div class="col-md-6">
          <label for="phone" class="form-label">Phone <span class="text-muted">(optional)</span></label>
          <input id="phone" type="tel" class="form-control" formControlName="phone" />
          <app-field-error [control]="form.controls.phone" />
        </div>

        <div class="col-md-4">
          <label for="salary" class="form-label">Salary</label>
          <input id="salary" type="number" step="0.01" min="0" class="form-control" formControlName="salary" />
          <app-field-error [control]="form.controls.salary" />
        </div>

        <div class="col-md-4">
          <label for="hireDate" class="form-label">Hire date</label>
          <input id="hireDate" type="date" class="form-control" formControlName="hireDate" />
          <app-field-error [control]="form.controls.hireDate" />
        </div>

        <div class="col-md-4">
          <label for="departmentId" class="form-label">Department</label>
          <select id="departmentId" class="form-select" formControlName="departmentId">
            <option [ngValue]="null" disabled>Select department</option>
            @for (department of departments(); track department.id) {
              <option [ngValue]="department.id">{{ department.name }}</option>
            }
          </select>
          <app-field-error [control]="form.controls.departmentId" />
        </div>

        <div class="col-12">
          <div class="form-check">
            <input id="isActive" type="checkbox" class="form-check-input" formControlName="isActive" />
            <label for="isActive" class="form-check-label">Active</label>
          </div>
        </div>
      </div>
    </div>

    <div class="card-footer d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        {{ saving() ? 'Saving…' : isEdit() ? 'Save changes' : 'Create' }}
      </button>
      <a routerLink="/employees" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
