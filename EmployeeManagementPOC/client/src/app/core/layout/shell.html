<header>
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" routerLink="/dashboard" (click)="closeMenus()">Employee Management</a>

      <button
        class="navbar-toggler"
        type="button"
        aria-label="Toggle navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="menuOpen.set(!menuOpen())"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" [class.show]="menuOpen()">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" routerLink="/dashboard" routerLinkActive="active" (click)="closeMenus()">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/employees" routerLinkActive="active" (click)="closeMenus()">Employees</a>
          </li>
          @if (canViewDepartments()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/departments" routerLinkActive="active" (click)="closeMenus()">
                Departments
              </a>
            </li>
          }
        </ul>

        @if (auth.user(); as user) {
          <ul class="navbar-nav">
            <li class="nav-item dropdown">
              <button
                type="button"
                class="nav-link dropdown-toggle d-flex align-items-center btn btn-link"
                [attr.aria-expanded]="userMenuOpen()"
                (click)="userMenuOpen.set(!userMenuOpen())"
              >
                <span class="user-avatar">{{ user.fullName | initials }}</span>
                <span>{{ user.email }}</span>
              </button>

              <ul class="dropdown-menu dropdown-menu-end shadow-sm" [class.show]="userMenuOpen()">
                <li>
                  <span class="dropdown-item-text text-muted small">
                    Signed in as {{ user.fullName }} · {{ user.roles.join(', ') }}
                  </span>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <button type="button" class="dropdown-item text-danger" (click)="signOut()">Sign out</button>
                </li>
              </ul>
            </li>
          </ul>
        }
      </div>
    </div>
  </nav>
</header>

<main class="container-fluid">
  <router-outlet />
</main>

<footer class="footer">
  <div class="container text-center">
    <span>&copy; {{ year }} - Employee Management</span>
  </div>
</footer>
