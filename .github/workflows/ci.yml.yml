name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EmployeeManagementPOC/EmployeeManagementPOC.csproj

      - name: Build
        run: dotnet build EmployeeManagementPOC/EmployeeManagementPOC.csproj --no-restore