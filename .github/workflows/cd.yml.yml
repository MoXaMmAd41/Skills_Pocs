name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EmployeeManagementPOC/client/package-lock.json

      - name: Build client
        working-directory: EmployeeManagementPOC/client
        run: |
          npm ci
          npx ng build --configuration production

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish API
        run: dotnet publish EmployeeManagementPOC/src/EmployeeManagement.Api/EmployeeManagement.Api.csproj -c Release -o publish

      - name: Copy client into wwwroot
        run: |
          New-Item -ItemType Directory -Force -Path publish/wwwroot | Out-Null
          Copy-Item -Path EmployeeManagementPOC/client/dist/client/browser/* -Destination publish/wwwroot -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-management
          path: publish
